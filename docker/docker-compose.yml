version: '3.8'

services:
  kg-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: kg-service
    ports:
      - "8034:8034"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - OTEL_ENABLED=true
      - OTEL_ENDPOINT=http://jaeger:4318
    depends_on:
      - neo4j
      - qdrant
      - rabbitmq
    networks:
      - kg-network
    restart: unless-stopped

  neo4j:
    image: neo4j:5.14.0
    container_name: kg-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    networks:
      - kg-network
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.7.0
    container_name: kg-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - kg-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: kg-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - kg-network
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.50
    container_name: kg-jaeger
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - kg-network
    restart: unless-stopped

networks:
  kg-network:
    driver: bridge

volumes:
  neo4j-data:
  neo4j-logs:
  qdrant-data:
  rabbitmq-data:
