version: '3.8'

services:
  kg-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: kg-service
    ports:
      - "8034:8034"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - OTEL_ENABLED=true
      - OTEL_ENDPOINT=http://jaeger:4318
    # rabbitmq/jaeger moved to shared infra (deploy/docker-compose.infra.yml,
    # a different compose project - bring up first: deploy/03-build-and-up.sh
    # infra-up). neo4j/qdrant stay local to this repo - this is the only
    # engine that uses either, so there's nothing duplicated to consolidate
    # there, unlike postgres/redis/rabbitmq/jaeger which every engine
    # duplicated identically.
    networks:
      - kg-network
      - os42-shared
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8034/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  neo4j:
    image: neo4j:5.14.0
    container_name: kg-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    networks:
      - kg-network
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.7.0
    container_name: kg-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - kg-network
    restart: unless-stopped

networks:
  kg-network:
    driver: bridge
  os42-shared:
    external: true

volumes:
  neo4j-data:
  neo4j-logs:
  qdrant-data:
